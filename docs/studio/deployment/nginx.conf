pid /var/lib/infinite-canvas/nginx.pid;
error_log stderr warn;
worker_processes 1;
events { worker_connections 1024; }
http {
    lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
    access_log off;
    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/wasm wasm;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
        image/x-icon ico;
        font/woff2 woff2;
        font/woff woff;
        video/mp4 mp4;
        video/webm webm;
        audio/flac flac;
        audio/wav wav;
        model/gltf-binary glb;
    }
    client_body_temp_path /var/lib/infinite-canvas/client_body;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 39445;
        server_name _;
        root /opt/infinite-canvas/current;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin '*' always;
        add_header Cache-Control no-cache always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; worker-src 'self'; connect-src http: https: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        location = / { return 302 /studio/; }
        location = /studio { return 308 /studio/; }
        location = /studio/assets { try_files /studio/index.html =404; }
        location = /studio/assets/ { try_files /studio/index.html =404; }
        location ~ ^/studio/assets/schema-worker-[A-Za-z0-9_-]+\.js$ {
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-cache always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; connect-src 'none'; object-src 'none'" always;
        }
        location /studio/assets/ { try_files $uri =404; }
        location /studio/ { try_files $uri $uri/ /studio/index.html; }
        location / { return 404; }
    }
}
