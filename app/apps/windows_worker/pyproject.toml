[project]
name = "render-windows-worker"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["generation-domain", "generation-contracts", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "pillow>=11,<13"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windows_worker"]

[project.scripts]
genworker = "windows_worker.main:main"
