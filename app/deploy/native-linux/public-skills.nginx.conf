# Include inside the existing public HTTP 39443 server only.
location = /skill.md {
    alias /var/lib/comfyui-aggregator/public-skills/media-gen/current/skill.md;
    default_type text/markdown;
    charset utf-8;
    charset_types text/markdown;
    etag on;
    add_header Cache-Control no-cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods $http_access_control_request_method always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    add_header Access-Control-Allow-Private-Network "true" always;
    add_header Access-Control-Max-Age 600 always;
    add_header Vary "Origin, Access-Control-Request-Method, Access-Control-Request-Headers, Access-Control-Request-Private-Network" always;
    add_header Access-Control-Expose-Headers "ETag, Last-Modified, Content-Length" always;
    if ($request_method = OPTIONS) { return 204; }
    limit_except GET OPTIONS { deny all; }
}

location ~ ^/skills/media-gen/(?<skill_version>[0-9]+\.[0-9]+\.[0-9]+)/(?<skill_asset>skill\.md|release\.json|SHA256SUMS\.txt|media-gen-skill-[0-9]+\.[0-9]+\.[0-9]+\.zip)$ {
    alias /var/lib/comfyui-aggregator/public-skills/media-gen/$skill_version/$skill_asset;
    types {
        text/markdown md;
        application/json json;
        text/plain txt;
        application/zip zip;
    }
    charset utf-8;
    charset_types text/markdown application/json text/plain;
    etag on;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods $http_access_control_request_method always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    add_header Access-Control-Allow-Private-Network "true" always;
    add_header Access-Control-Max-Age 600 always;
    add_header Vary "Origin, Access-Control-Request-Method, Access-Control-Request-Headers, Access-Control-Request-Private-Network" always;
    add_header Access-Control-Expose-Headers "ETag, Last-Modified, Content-Length" always;
    if ($request_method = OPTIONS) { return 204; }
    limit_except GET OPTIONS { deny all; }
}

location /skills/media-gen/ { return 404; }
