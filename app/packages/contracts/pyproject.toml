[project]
name = "generation-contracts"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.10,<3", "jsonschema>=4.23,<5"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generation_contracts"]
