name: Media Gen Skill Release

on:
  push:
    tags: ['media-gen-skill-v*']

permissions:
  contents: read

concurrency:
  group: media-gen-skill-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'copypasteltd/comfyUI-aggregator-proxy'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the pushed release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build, verify and publish the tagged Skill
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: bash app/scripts/publish-media-gen-skill.sh
