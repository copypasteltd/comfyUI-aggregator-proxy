        # Managed Studio 131. The API/Admin and private Worker listeners stay independent.
        location = /studio { return 302 /studio/; }
        location ~ ^/studio/assets/schema-worker-[A-Za-z0-9_-]+\.js$ {
            root /opt/comfyui-aggregator/studio-current;
            types { application/javascript js; }
            try_files $uri =404;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval'; connect-src 'none'; worker-src 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-cache always;
        }
        location /studio/ {
            root /opt/comfyui-aggregator/studio-current;
            types {
                text/html html;
                application/javascript js mjs;
                text/css css;
                application/json json;
                image/svg+xml svg;
                image/png png;
                image/jpeg jpg jpeg;
                image/x-icon ico;
                font/woff woff;
                font/woff2 woff2;
            }
            try_files $uri $uri/ /studio/index.html;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; worker-src 'self'; connect-src http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-cache always;
        }
